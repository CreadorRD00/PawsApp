<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1D63A6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PawsApp">
<title>PawsApp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap');

:root{
  --bg: #EAF2FA;
  --surface: #FFFFFF;
  --ink: #17233B;
  --muted: #6B7C93;
  --primary: #1D63A6;
  --primary-soft: #DEEBF8;
  --accent: #F0932B;
  --accent-soft: #FCE7CC;
  --alert: #C1502E;
  --alert-soft: #F6DFD4;
  --line: #D6E4F0;
  --radius: 14px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: 'Karla', sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height:100vh;
}
h1,h2,h3,.brand{ font-family:'Baloo 2', sans-serif; }
.logo-mark{
  width:40px;height:40px;border-radius:11px;
  background: var(--primary-soft);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-name{ font-size:22px; margin:0; font-weight:700; }
.brand-name .paws{ color:#17233B; }
.brand-name .app{ color:#6BAAE0; }

#app{
  max-width: 480px;
  margin: 0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background: var(--bg);
  position:relative;
  padding-bottom: 78px;
}
#app.hidden{ display:none; }

/* ---------- Auth screen ---------- */
#auth-screen{
  max-width:480px; margin:0 auto; min-height:100vh;
  display:flex; flex-direction:column; justify-content:center;
  padding: 30px 26px; background: var(--bg);
}
#auth-screen.hidden{ display:none; }
.auth-logo{ text-align:center; margin-bottom: 22px; }
.auth-logo .logo-mark{ margin: 0 auto 10px; width:60px; height:60px; }
.auth-logo h1{ font-size:28px; margin:0; }
.auth-tabs{ display:flex; gap:8px; margin-bottom:18px; background:var(--surface); border-radius:12px; padding:4px; border:1px solid var(--line); }
.auth-tab{ flex:1; text-align:center; padding:9px; border-radius:9px; font-weight:700; font-size:13.5px; color:var(--muted); cursor:pointer; }
.auth-tab.active{ background:var(--primary); color:#fff; }
.auth-error{ color:var(--alert); font-size:12.5px; margin-top:6px; min-height:16px; }
.auth-msg{ color:var(--primary); font-size:12.5px; margin-top:6px; min-height:16px; }

/* Header */
header.top{
  padding: 22px 20px 16px;
  display:flex;
  align-items:center;
  gap:10px;
}
header.top h1{
  font-size:22px;
  margin:0;
  color:var(--primary);
  font-weight:700;
}
header.top .tagline{
  font-size:12px;
  color:var(--muted);
  margin-top: -2px;
}

main{ padding: 0 18px 24px; flex:1; }

.section-title{
  font-size:15px;
  font-weight:700;
  color:var(--primary);
  margin: 4px 0 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* Cards */
.card{
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  padding: 14px;
  margin-bottom: 12px;
}

/* Pet card - passport style */
.pet-card{
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer;
  position:relative;
}
.pet-card::after{
  content:"";
  position:absolute;
  right:14px; top:50%; transform:translateY(-50%);
  width:8px;height:8px;
  border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted);
  transform: translateY(-50%) rotate(-45deg);
  opacity:0.5;
}
.pet-photo{
  width:56px;height:56px;border-radius:50%;
  object-fit:cover;
  background: var(--primary-soft);
  border: 2px solid var(--primary);
  flex-shrink:0;
}
.pet-photo.placeholder{
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
}
.pet-info .name{ font-weight:700; font-size:16px; }
.pet-info .meta{ font-size:12px; color:var(--muted); margin-top:2px;}

/* Vaccine stamp entry */
.vax-entry{
  display:flex;
  gap:12px;
  padding: 12px 0;
  border-bottom: 1px dashed var(--line);
}
.vax-entry:last-child{ border-bottom:none; }
.vax-icon{
  width:40px;height:40px;border-radius:10px;
  background: var(--primary-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  flex-shrink:0;
}
.vax-icon.due{ background: var(--alert-soft); }
.vax-body{ flex:1; }
.vax-name{ font-weight:600; font-size:14.5px; }
.vax-dates{ font-size:12px; color:var(--muted); margin-top:2px; }
.vax-dates .next.due{ color: var(--alert); font-weight:700; }
.vax-photo-link{
  font-size:11.5px; color:var(--primary); text-decoration:underline; margin-top:4px; display:inline-block; cursor:pointer;
}

/* Event card */
.event-card{ display:flex; gap:12px; align-items:flex-start; }
.event-date-chip{
  background: var(--accent-soft);
  color:#8a5a12;
  border-radius:10px;
  padding:6px 8px;
  text-align:center;
  min-width:52px;
  flex-shrink:0;
}
.event-date-chip .d{ font-size:17px; font-weight:700; line-height:1; }
.event-date-chip .m{ font-size:10px; text-transform:uppercase; letter-spacing:.03em; }
.event-title{ font-weight:700; font-size:14.5px; }
.event-sub{ font-size:12px; color:var(--muted); margin-top:2px; }

/* Sponsor banner */
.sponsor-card{ padding:0; overflow:hidden; }
.sponsor-banner-wrap{ position:relative; }
.sponsor-banner{ width:100%; height:128px; object-fit:cover; display:block; background:var(--primary-soft); }
.sponsor-banner.placeholder{ display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--muted); }
.sponsor-cat-chip{
  position:absolute; left:10px; top:10px;
  background: rgba(23,35,59,0.72); color:#fff;
  font-size:11px; font-weight:700; padding:4px 10px;
  border-radius:20px; display:flex; align-items:center; gap:5px;
  backdrop-filter: blur(2px);
}
.sponsor-body{ padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.sponsor-name{ font-weight:700; font-size:15px; }
.sponsor-tag{ font-size:11.5px; color:var(--accent); font-weight:700; margin-top:1px; }
.chip-filters{ display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:2px; }
.chip-filters::-webkit-scrollbar{ display:none; }
.chip-filter{
  flex-shrink:0; border:1.5px solid var(--line); background:var(--surface);
  color:var(--muted); font-family:'Karla',sans-serif; font-weight:700; font-size:12.5px;
  padding:7px 13px; border-radius:20px; cursor:pointer; white-space:nowrap;
}
.chip-filter.active{ background:var(--primary); border-color:var(--primary); color:#fff; }

/* Admin */
.admin-banner{
  background: var(--accent-soft); color:#8a5a12; font-weight:700; font-size:12.5px;
  padding:9px 12px; border-radius:10px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.admin-banner button{ background:none; border:none; color:#8a5a12; font-weight:700; text-decoration:underline; cursor:pointer; font-size:12px; }
.role-pill{
  font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px;
  background: var(--primary-soft); color:var(--primary); margin-left:6px;
}
.role-pill.admin{ background: var(--accent-soft); color:#8a5a12; }
.user-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px dashed var(--line); }
.user-row:last-child{ border-bottom:none; }
.user-row .u-name{ font-weight:700; font-size:14.5px; }
.user-row .u-email{ font-size:12px; color:var(--muted); }

/* Buttons */
.btn{
  border:none; border-radius:10px; padding:10px 16px;
  font-family:'Karla',sans-serif; font-weight:700; font-size:13.5px;
  cursor:pointer;
}
.btn-primary{ background: var(--primary); color:#fff; }
.btn-outline{ background:transparent; color:var(--primary); border:1.5px solid var(--primary); }
.btn-accent{ background: var(--accent); color:#4a3106; }
.btn-block{ width:100%; }
.btn-sm{ padding:6px 10px; font-size:12px; }
.btn:disabled{ opacity:0.55; cursor:default; }

.fab{
  position:absolute;
  right:18px; bottom:94px;
  width:52px;height:52px;border-radius:50%;
  background: var(--primary); color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:26px; border:none; cursor:pointer;
  box-shadow: 0 6px 16px rgba(47,82,51,0.35);
  z-index:20;
}

/* Empty state */
.empty{
  text-align:center; padding: 34px 20px; color:var(--muted);
}
.empty .big{ font-size:34px; margin-bottom:8px; }
.empty p{ font-size:13px; margin: 4px 0 14px; line-height:1.5; }

/* Bottom nav */
nav.tabbar{
  position: fixed;
  bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  display:flex;
  padding: 8px 4px 10px;
  z-index:30;
}
nav.tabbar button{
  flex:1; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color: var(--muted); font-family:'Karla',sans-serif; font-size:10px; font-weight:600;
  padding:4px 0;
}
nav.tabbar button .ic{ font-size:18px; }
nav.tabbar button.active{ color: var(--primary); }

/* Modal */
.overlay{
  position:fixed; inset:0; background:rgba(20,25,18,0.45);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:100;
}
.overlay.hidden{ display:none; }
.modal{
  background: var(--surface);
  width:100%; max-width:480px;
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 26px;
  max-height: 86vh; overflow-y:auto;
}
.modal h3{ margin:0 0 14px; color:var(--primary); }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; }
.field input, .field select, .field textarea{
  width:100%; border:1.5px solid var(--line); border-radius:10px;
  padding:10px 11px; font-family:'Karla',sans-serif; font-size:14px;
  background:#FAFBF8; color:var(--ink);
}
.field textarea{ resize:vertical; min-height:60px; }
.photo-upload{
  display:flex; align-items:center; gap:12px;
}
.photo-preview{
  width:60px;height:60px;border-radius:12px;object-fit:cover;
  background: var(--primary-soft); border:1.5px dashed var(--line);
}
.modal-actions{ display:flex; gap:10px; margin-top:16px; }
.modal-actions .btn{ flex:1; }
.close-x{ position:absolute; right:16px; top:14px; background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer; }

.role-badge{
  display:inline-block; font-size:11px; font-weight:700; padding:4px 10px;
  border-radius:20px; background: var(--accent-soft); color:#8a5a12; margin-top:6px;
}
.profile-photo-big{ width:84px;height:84px;border-radius:50%; object-fit:cover; border:2.5px solid var(--primary); background:var(--primary-soft); }
</style>
</head>
<body>

  <div class="auth-logo">
    <div class="logo-mark">
      <svg width="34" height="34" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="30" cy="26" rx="10" ry="13" fill="#1D63A6"/>

  <header class="top">
    <div class="logo-mark">
      <svg width="26" height="26" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

<script>
// ---------- Supabase ----------
const SUPABASE_URL = 'https://bicmopgmwabjtemkmdix.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2OiIuflda_JXgkZuM3WhAg_iVsIUPqu';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- Estado ----------
let state = {
  tab: 'mascotas',
  pets: [],
  vaccines: [],
  events: [],
  sponsors: [],
  users: [],
  profile: null,
  user: null,
  isAdmin: false,
  selectedPetId: null,
  adminViewingUserId: null, // si el admin está viendo los datos de otro usuario
  loaded: false
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function currentOwnerId(){ return state.adminViewingUserId || state.user.id; }

// ============================================================
// AUTENTICACIÓN
// ============================================================
let authTab = 'login';
function switchAuthTab(tab){
  authTab = tab;
  document.querySelector('.auth-tabs').style.display = (tab==='forgot'||tab==='reset') ? 'none' : 'flex';
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  renderAuthForm();
}

function renderAuthForm(){
  const box = document.getElementById('auth-form');
  if(authTab === 'login'){
    box.innerHTML = `
      <div class="field"><label>Correo electrónico</label><input id="a-email" type="email" placeholder="tu@correo.com"></div>
      <div class="field"><label>Contraseña</label><input id="a-pass" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block" id="a-submit">Iniciar sesión</button>
      <div class="auth-error" id="a-error"></div>
      <div style="text-align:center; margin-top:10px;">
        <span style="font-size:12.5px; color:var(--primary); text-decoration:underline; cursor:pointer;" id="forgot-link">¿Olvidaste tu contraseña?</span>
      </div>
    `;
    document.getElementById('a-submit').onclick = doLogin;
    document.getElementById('forgot-link').onclick = ()=> switchAuthTab('forgot');
  }else if(authTab === 'forgot'){
    box.innerHTML = `
      <p style="font-size:13px; color:var(--muted); margin-top:0;">Escribe tu correo y te enviaremos un enlace para crear una nueva contraseña.</p>
      <div class="field"><label>Correo electrónico</label><input id="a-email" type="email" placeholder="tu@correo.com"></div>
      <button class="btn btn-primary btn-block" id="a-submit">Enviar enlace de recuperación</button>
      <div class="auth-error" id="a-error"></div>
      <div class="auth-msg" id="a-msg"></div>
      <div style="text-align:center; margin-top:10px;">
        <span style="font-size:12.5px; color:var(--primary); text-decoration:underline; cursor:pointer;" id="back-link">Volver a iniciar sesión</span>
      </div>
    `;
    document.getElementById('a-submit').onclick = doForgotPassword;
    document.getElementById('back-link').onclick = ()=> switchAuthTab('login');
  }else if(authTab === 'reset'){
    box.innerHTML = `
      <p style="font-size:13px; color:var(--muted); margin-top:0;">Escribe tu nueva contraseña.</p>
      <div class="field"><label>Nueva contraseña</label><input id="a-newpass" type="password" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn btn-primary btn-block" id="a-submit">Guardar nueva contraseña</button>
      <div class="auth-error" id="a-error"></div>
      <div class="auth-msg" id="a-msg"></div>
    `;
    document.getElementById('a-submit').onclick = doUpdatePassword;
  }else{
    box.innerHTML = `
      <div class="field"><label>Nombre</label><input id="a-name" placeholder="Tu nombre"></div>
      <div class="field"><label>Correo electrónico</label><input id="a-email" type="email" placeholder="tu@correo.com"></div>
      <div class="field"><label>Contraseña</label><input id="a-pass" type="password" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn btn-primary btn-block" id="a-submit">Crear cuenta</button>
      <div class="auth-error" id="a-error"></div>
      <div class="auth-msg" id="a-msg"></div>
    `;
    document.getElementById('a-submit').onclick = doRegister;
  }
}

async function doLogin(){
  const email = document.getElementById('a-email').value.trim();
  const password = document.getElementById('a-pass').value;
  const errBox = document.getElementById('a-error');
  errBox.textContent = '';
  if(!email || !password){ errBox.textContent = 'Completa correo y contraseña'; return; }
  const btn = document.getElementById('a-submit');
  btn.disabled = true; btn.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Iniciar sesión';
  if(error){ errBox.textContent = traducirError(error.message); return; }
  // onAuthStateChange se encarga de cargar la app
}

async function doRegister(){
  const name = document.getElementById('a-name').value.trim();
  const email = document.getElementById('a-email').value.trim();
  const password = document.getElementById('a-pass').value;
  const errBox = document.getElementById('a-error');
  const msgBox = document.getElementById('a-msg');
  errBox.textContent = ''; msgBox.textContent = '';
  if(!name || !email || !password){ errBox.textContent = 'Completa todos los campos'; return; }
  if(password.length < 6){ errBox.textContent = 'La contraseña debe tener al menos 6 caracteres'; return; }
  const btn = document.getElementById('a-submit');
  btn.disabled = true; btn.textContent = 'Creando cuenta…';
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { name } }
  });
  btn.disabled = false; btn.textContent = 'Crear cuenta';
  if(error){ errBox.textContent = traducirError(error.message); return; }
  if(data.session){
    // confirmación de correo desactivada: entra directo
    return;
  }
  msgBox.textContent = 'Cuenta creada. Revisa tu correo para confirmar antes de iniciar sesión.';
  switchAuthTab('login');
}

function traducirError(msg){
  if(/invalid login credentials/i.test(msg)) return 'Correo o contraseña incorrectos';
  if(/already registered/i.test(msg)) return 'Ese correo ya tiene una cuenta';
  if(/rate limit/i.test(msg)) return 'Demasiados intentos, espera un momento';
  return msg;
}

async function doLogout(){
  await sb.auth.signOut();
}

async function doForgotPassword(){
  const email = document.getElementById('a-email').value.trim();
  const errBox = document.getElementById('a-error');
  const msgBox = document.getElementById('a-msg');
  errBox.textContent = ''; msgBox.textContent = '';
  if(!email){ errBox.textContent = 'Escribe tu correo'; return; }
  const btn = document.getElementById('a-submit');
  btn.disabled = true; btn.textContent = 'Enviando…';
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
  btn.disabled = false; btn.textContent = 'Enviar enlace de recuperación';

  msgBox.textContent = 'Listo, revisa tu correo (y la carpeta de spam) para el enlace.';

async function doUpdatePassword(){
  const pass = document.getElementById('a-newpass').value;
  const errBox = document.getElementById('a-error');
  const msgBox = document.getElementById('a-msg');
  errBox.textContent = ''; msgBox.textContent = '';
  if(!pass || pass.length < 6){ errBox.textContent = 'La contraseña debe tener al menos 6 caracteres'; return; }
  const btn = document.getElementById('a-submit');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { error } = await sb.auth.updateUser({ password: pass });
  btn.disabled = false; btn.textContent = 'Guardar nueva contraseña';
  if(error){ errBox.textContent = traducirError(error.message); return; }
  msgBox.textContent = 'Contraseña actualizada. Entrando…';
  setTimeout(()=>{ switchAuthTab('login'); }, 1200);
}

sb.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY'){
    document.getElementById('app').classList.add('hidden');
    document.getElementById('auth-screen').classList.remove('hidden');
    document.querySelector('.auth-tabs').style.display = 'none';
    switchAuthTab('reset');
    return;
  }
  if(session && session.user){
    state.user = session.user;
    bootApp();
  }else{
    state.user = null;
    state.profile = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('auth-screen').classList.remove('hidden');
    renderAuthForm();
  }
});

async function bootApp(){
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  main_loading();

  // Cargar perfil (reintenta un par de veces por si el trigger tarda un pelín)
  let profile = null;
  for(let i=0; i<4 && !profile; i++){
    const { data } = await sb.from('profiles').select('*').eq('id', state.user.id).maybeSingle();
    if(data){ profile = data; break; }
    await new Promise(r=>setTimeout(r, 400));
  }
  state.profile = profile || { id: state.user.id, name:'', email: state.user.email, role:'usuario' };
  state.isAdmin = state.profile.role === 'admin';
  buildTabbar();
  await loadAll();
  // Registrar que este usuario está activo ahora mismo
  sb.from('profiles').update({ last_seen_at: new Date().toISOString() }).eq('id', state.user.id).then(()=>{});
}

async function loadAll(){
  const ownerId = currentOwnerId();
  const [petsRes, vaxRes, evRes, spRes] = await Promise.all([
    sb.from('pets').select('*').eq('owner_id', ownerId).order('created_at'),
    sb.from('vaccines').select('*').eq('owner_id', ownerId).order('date_applied', {ascending:false}),
    sb.from('events').select('*').eq('owner_id', ownerId).order('date'),
    sb.from('sponsors').select('*').order('created_at', {ascending:false})
  ]);
  state.pets = (petsRes.data||[]).map(mapPetFromDb);
  state.vaccines = (vaxRes.data||[]).map(mapVaxFromDb);

    const usersRes = await sb.from('profiles').select('*').order('created_at', {ascending:false});

// Mapear nombres de columnas (snake_case en DB) a los que usa la interfaz
function mapPetFromDb(p){ return { id:p.id, name:p.name, type:p.type, breed:p.breed, photo:p.photo, hasChip:p.has_chip, chipNumber:p.chip_number }; }
function mapVaxFromDb(v){ return { id:v.id, petId:v.pet_id, name:v.name, dateApplied:v.date_applied, nextDose:v.next_dose, photo:v.photo }; }
function mapEventFromDb(e){ return { id:e.id, title:e.title, date:e.date, type:e.type, notes:e.notes }; }
function mapSponsorFromDb(s){ return { id:s.id, name:s.name, category:s.category, banner:s.banner, link:s.link }; }

// ---------- Utilidad: comprimir imagen ----------
function fileToCompressedDataUrl(file, maxW){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- Render principal ----------
function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  const main = document.getElementById('main');
  if(!state.loaded){ main.innerHTML = '<div class="empty">Cargando…</div>'; return; }

  const taglines = {
    mascotas: 'La cartilla de tus mascotas, siempre a mano',
    vacunas: 'Cada dosis, registrada y a tiempo',
    calendario: 'Citas, paseos y refuerzos en un solo lugar',
    patrocinios: 'Negocios de confianza para tu mascota',
    usuarios: 'Panel de administración',
    perfil: 'Tu cuenta en PawsApp'
  };
  document.getElementById('tagline').textContent = taglines[state.tab];

  main.innerHTML = '';
  if(state.adminViewingUserId && ['mascotas','vacunas','calendario'].includes(state.tab)){
    const viewedUser = state.users.find(u=>u.id===state.adminViewingUserId);
    const banner = document.createElement('div');
    banner.className = 'admin-banner';
    banner.innerHTML = `<span>👁️ Viendo datos de: ${escapeHtml(viewedUser?viewedUser.name||viewedUser.email:'usuario')}</span><button id="stop-viewing">Volver a mi cuenta</button>`;
    main.appendChild(banner);
    banner.querySelector('#stop-viewing').onclick = async ()=>{ state.adminViewingUserId = null; await loadAll(); };
  }

  const container = document.createElement('div');
  main.appendChild(container);

  if(state.tab === 'mascotas') renderMascotas(container);
  if(state.tab === 'vacunas') renderVacunas(container);
  if(state.tab === 'calendario') renderCalendario(container);
  if(state.tab === 'patrocinios') renderPatrocinios(container);
  if(state.tab === 'usuarios') renderUsuarios(container);
  if(state.tab === 'perfil') renderPerfil(container);
}

function petPhotoHtml(pet, size){
  if(pet && pet.photo){
    return `<img class="pet-photo" style="width:${size}px;height:${size}px" src="${pet.photo}">`;

  const icon = pet && pet.type === 'Gato' ? '🐱' : (pet && pet.type === 'Perro' ? '🐶' : '🐾');
  return `<div class="pet-photo placeholder" style="width:${size}px;height:${size}px">${icon}</div>`;
}

async function savePet(id){
  const name = document.getElementById('f-name').value.trim();

  const breed = document.getElementById('f-breed').value.trim();
  const photoEl = document.getElementById('f-photo-preview');
  const photo = photoEl.dataset.value || photoEl.src || '';
  const hasChip = document.getElementById('f-haschip').checked;
  const chipNumber = hasChip ? document.getElementById('f-chipnum').value.trim() : '';
  if(id){
    const { error } = await sb.from('pets').update({ name, type, breed, photo, has_chip: hasChip, chip_number: chipNumber }).eq('id', id);
    if(error){ alert('No se pudo actualizar la mascota: ' + error.message); return; }

    const { error } = await sb.from('pets').insert({ owner_id: currentOwnerId(), name, type, breed, photo, has_chip: hasChip, chip_number: chipNumber });

  closeModal(); await loadAll();

  });

  const list = document.getElementById('sponsor-list');
  const filtered = state.sponsorFilter==='Todos'? state.sponsors : state.sponsors.filter(s=>s.category===state.sponsorFilter);

  if(state.sponsors.length===0){
    list.innerHTML = `<div class="empty"><div class="big">🏪</div><h3>Sin anuncios todavía</h3><p>${state.isAdmin? 'Agrega veterinarias, pet-shops u otros negocios locales de confianza.':'Todavía no hay negocios patrocinadores publicados.'}</p>${state.isAdmin? `<button class="btn btn-primary" onclick="openSponsorForm()">Agregar negocio</button>`:''}</div>`;
    return;
  }
  if(filtered.length===0){
    list.innerHTML = `<div class="empty"><p>No hay negocios en esta categoría todavía.</p></div>`;
    return;
  }
  filtered.forEach(s=>{
    const cat = s.category || 'Otro';
    const div = document.createElement('div');
    div.className = 'card sponsor-card';
    div.innerHTML = `
      <div class="sponsor-banner-wrap">
        ${s.banner? `<img class="sponsor-banner" src="${s.banner}">` : `<div class="sponsor-banner placeholder">${SPONSOR_CATEGORIES[cat]||'🏪'}</div>`}
        <div class="sponsor-cat-chip">${SPONSOR_CATEGORIES[cat]||'🏪'} ${escapeHtml(cat)}</div>
      </div>
      <div class="sponsor-body">
        <div>
          <div class="sponsor-name">${escapeHtml(s.name)}</div>
          <div class="sponsor-tag">Patrocinador</div>
        </div>
        <div style="display:flex; gap:6px;">
          ${s.link? `<button class="btn btn-accent btn-sm" onclick="window.open('${escapeAttr(s.link)}','_blank')">Visitar</button>`:''}
          ${state.isAdmin? `<button class="btn btn-outline btn-sm" onclick="openSponsorForm('${s.id}')">Editar</button>`:''}
        </div>
      </div>`;
    list.appendChild(div);
  });
}

function openSponsorForm(id){
  if(!state.isAdmin){ return; }
  const s = id? state.sponsors.find(x=>x.id===id) : null;
  showModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>${s?'Editar negocio':'Nuevo negocio patrocinador'}</h3>
    <div class="field"><label>Nombre del negocio</label><input id="s-name" value="${s?escapeAttr(s.name):''}" placeholder="Ej: Veterinaria Los Amigos"></div>
    <div class="field"><label>Categoría</label>
      <select id="s-category">
        ${Object.keys(SPONSOR_CATEGORIES).map(c=>`<option ${s&&s.category===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Banner publicitario</label>
      <div class="photo-upload">
        <img class="photo-preview" id="s-banner-preview" src="${s&&s.banner?s.banner:''}">
        <input type="file" accept="image/*" id="s-banner">
      </div>
    </div>
    <div class="field"><label>Enlace (WhatsApp / Instagram / web)</label><input id="s-link" value="${s?escapeAttr(s.link||''):''}" placeholder="https://…"></div>
    <div class="modal-actions">
      ${s? `<button class="btn btn-outline" onclick="deleteSponsor('${s.id}')">Eliminar</button>`:''}
      <button class="btn btn-primary btn-block" onclick="saveSponsor(${s?`'${s.id}'`:'null'})">Guardar</button>
    </div>
  `);
  document.getElementById('s-banner').addEventListener('change', async (e)=>{
    if(e.target.files[0]){
      const url = await fileToCompressedDataUrl(e.target.files[0], 600);
      document.getElementById('s-banner-preview').src = url;
      document.getElementById('s-banner-preview').dataset.value = url;
    }
  });
}

async function saveSponsor(id){
  const name = document.getElementById('s-name').value.trim();
  if(!name){ alert('Ponle un nombre al negocio'); return; }
  const category = document.getElementById('s-category').value;
  const link = document.getElementById('s-link').value.trim();
  const bannerEl = document.getElementById('s-banner-preview');
  const banner = bannerEl.dataset.value || bannerEl.src || '';
  if(id){
    await sb.from('sponsors').update({ name, category, link, banner }).eq('id', id);
  }else{
    const { error } = await sb.from('sponsors').insert({ name, category, link, banner, created_by: state.user.id });
    if(error){ alert('No se pudo guardar el anuncio: ' + error.message); return; }
  }
  closeModal(); await loadAll();
}

async function deleteSponsor(id){
  if(!confirm('¿Eliminar este anuncio?')) return;
  await sb.from('sponsors').delete().eq('id', id);
  closeModal(); await loadAll();
}

// ---------- Usuarios (solo admin) ----------

  main.innerHTML += `<div class="section-title">Usuarios registrados (${state.users.length})</div><div class="card" id="user-list"></div>`;
  const list = document.getElementById('user-list');
  if(state.users.length===0){
    list.innerHTML = `<div class="empty"><p>Aún no hay usuarios registrados.</p></div>`;
    return;
  }
  list.innerHTML = state.users.map(u=>`
    <div class="user-row">
      <div>
        <div class="u-name">${escapeHtml(u.name||'(sin nombre)')} <span class="role-pill ${u.role==='admin'?'admin':''}">${u.role}</span></div>
        <div class="u-email">${escapeHtml(u.email||'')}</div>
        <div class="u-email">${formatLastSeen(u.last_seen_at)}</div>
      </div>
      ${u.id!==state.user.id? `<button class="btn btn-outline btn-sm" onclick="viewUserData('${u.id}')">Ver datos</button>` : `<span style="font-size:11px;color:var(--muted);">Tú</span>`}
    </div>
  `).join('');
}

function formatLastSeen(dateStr){
  if(!dateStr) return '🔴 Nunca ha entrado';
  const last = new Date(dateStr);
  const diffMs = Date.now() - last.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  const diffH = Math.floor(diffMin / 60);
  const diffD = Math.floor(diffH / 24);
  let texto;
  if(diffMin < 2) texto = '🟢 Activo ahora mismo';
  else if(diffMin < 60) texto = `🟡 Hace ${diffMin} min`;
  else if(diffH < 24) texto = `🟡 Hace ${diffH} h`;
  else texto = `⚪ Hace ${diffD} día${diffD===1?'':'s'}`;
  return texto + ' · ' + last.toLocaleString('es-ES', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
}

async function viewUserData(userId){
  state.adminViewingUserId = userId;
  state.tab = 'mascotas';
  await loadAll();
}

async function saveProfile(){
  const name = document.getElementById('p-name').value.trim();
  const phone = document.getElementById('p-phone').value.trim();

  const photoEl = document.getElementById('p-photo-preview');

// ---------- Modal helpers ----------
function showModal(html){
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('overlay').classList.add('hidden');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeModal();
});

// ---------- FAB ----------
document.getElementById('fab').addEventListener('click', ()=>{
  if(state.tab==='mascotas') openPetForm();
  else if(state.tab==='vacunas') openVaxForm();
  else if(state.tab==='calendario') openEventForm();
  else if(state.tab==='patrocinios'){ if(state.isAdmin) openSponsorForm(); }
  else if(state.tab==='perfil') openProfileForm();
});

// ---------- Helpers ----------
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }
function formatDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'});
}

sb.auth.getSession().then(({data:{session}})=>{
  if(session && session.user){
    state.user = session.user;
    bootApp();
  }
});

// ---------- Notificaciones Push ----------
const VAPID_PUBLIC_KEY = 'BASjh4GDLwxwrFoAFOwK_mCjs8iFG1dDIBCWfS-FUUT5nTjzCdRG-HN9AtWRCqvOHfFkg4UTeo6z92IlEhK-uiU';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0; i<rawData.length; i++){ outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}

async function refreshNotifButton(){
  const btn = document.getElementById('notif-btn');
  if(!btn) return;
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    btn.textContent = '🔕 Este navegador no soporta notificaciones';
    btn.disabled = true;
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if(sub){
    btn.textContent = '🔔 Notificaciones activadas ✓';
  }else{
    btn.textContent = '🔔 Activar notificaciones';
  }
}

async function toggleNotifications(){
  const btn = document.getElementById('notif-btn');
  const msg = document.getElementById('notif-msg');
  msg.textContent = '';
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    msg.textContent = 'Tu navegador no soporta notificaciones push.';
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  const existing = await reg.pushManager.getSubscription();

  if(existing){
    // Ya estaba activado -> lo desactivamos
    await sb.from('push_subscriptions').delete().eq('endpoint', existing.endpoint);
    await existing.unsubscribe();
    msg.textContent = 'Notificaciones desactivadas.';
    refreshNotifButton();
    return;
  }

  const permission = await Notification.requestPermission();
  if(permission !== 'granted'){
    msg.textContent = 'No se concedió permiso para notificaciones.';
    return;
  }

  try{
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    const subJson = sub.toJSON();
    await sb.from('push_subscriptions').upsert({
      owner_id: state.user.id,
      endpoint: subJson.endpoint,
      p256dh: subJson.keys.p256dh,
      auth: subJson.keys.auth
    }, { onConflict: 'endpoint' });
    msg.textContent = '¡Listo! Ya recibirás recordatorios.';
  }catch(err){
    console.error(err);
    msg.textContent = 'No se pudo activar. Intenta de nuevo.';
  }
  refreshNotifButton();
}

// ---------- Service Worker (hace la app instalable) ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(err=>{
      console.warn('No se pudo registrar el service worker', err);
    });
  });
}
